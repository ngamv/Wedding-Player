  Google/IBM X-Y-Z heuristics calibrated by seniority, layout linearization and PDF
  text layer integrity auditing, regulatory compliance (EU AI Act, NYC LL 144), sub-5ms
  client-side execution, and Agent-Native BYOK architecture.

  Livre une proposition textuelle et précise tes hypothèses. Utilise les informations
  fournies. Les décisions et actions externes sont à valider. En sécurité, concentre-toi
  sur la revue défensive et les correctifs.'
